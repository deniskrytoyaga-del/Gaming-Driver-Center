name: Build Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "backend/**"
      - "frontend/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GamingDriverCenter --add-data "frontend;frontend" --collect-all webview app.py
      - name: Publish direct EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gdc-build-${{ github.run_number }}
          name: Gaming Driver Center build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/GamingDriverCenter.exe
