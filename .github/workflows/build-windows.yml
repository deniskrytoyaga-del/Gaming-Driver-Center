name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "backend/**"
      - "frontend/**"
      - "installer/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Build application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name GamingDriverCenter --add-data "frontend;frontend" --collect-all webview app.py
          if (!(Test-Path "dist/GamingDriverCenter/GamingDriverCenter.exe")) { throw "PyInstaller output EXE was not found." }
      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ChocolateyInstall}\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (!$iscc) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}", "${env:ProgramFiles}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (!$iscc) { throw "Inno Setup compiler ISCC.exe was not found." }
          "iscc_path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Using Inno Setup compiler: $iscc"
      - name: Build installer
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "installer/GDC.iss"
          $appExe = Join-Path $env:GITHUB_WORKSPACE "dist/GamingDriverCenter/GamingDriverCenter.exe"
          if (!(Test-Path $script)) { throw "Installer script not found: $script" }
          if (!(Test-Path $appExe)) { throw "Application folder not found: $appExe" }
          & "${{ steps.inno.outputs.iscc_path }}" "/Qp" $script
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/GamingDriverCenter-Setup.exe")) { throw "Installer output was not created." }
      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gdc-build-${{ github.run_number }}
          name: Gaming Driver Center build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/GamingDriverCenter-Setup.exe
